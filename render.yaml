services:
  - type: web
    name: tgtool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_API_ID
        sync: false          # set manually in Render dashboard
      - key: TELEGRAM_API_HASH
        sync: false          # set manually in Render dashboard
